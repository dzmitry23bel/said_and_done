name = "said-and-done-likes"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Sites allowed to call the API from a browser, comma-separated.
ALLOWED_ORIGINS = "https://saidanddone.fyi,https://dzmitry23bel.github.io"
# Published data file; the Worker accepts likes only for ids found here.
PREDICTIONS_URL = "https://saidanddone.fyi/predictions.js"
# "true" stops all new likes and unlikes (counts stay visible).
LIKES_FROZEN = "false"
# "true" stops new visitor messages.
MESSAGES_FROZEN = "false"

[[d1_databases]]
binding = "DB"
database_name = "said-and-done-likes"
database_id = "9f3acf4f-1ab3-4231-8292-163533a7db0b"

# At most 20 reaction requests per IP per minute.
[[ratelimits]]
name = "LIKE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# At most 3 messages per IP per minute (on top of the daily caps in src/index.js).
[[ratelimits]]
name = "MSG_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

# Secrets (not in this file), set with `npx wrangler secret put <NAME>`:
#   LIKE_SECRET       required: random string used to make the one-way voter codes
#   TURNSTILE_SECRET  optional: turns on the Turnstile bot check (reserve, off by default)
