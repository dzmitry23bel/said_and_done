<!doctype html>
<!-- YouTube channel banner for Said & Done, 2560x1440.
     Render: msedge --headless --hide-scrollbars --window-size=2560,1440 --screenshot=banner.png banner.html
     Safe area (visible on every device): 1546x423 in the centre, x 507-2053, y 508-931.
     Desktop shows the full width of the band y 508-931; TV shows everything. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Said &amp; Done banner</title>
<style>
  :root {
    --bg: #0E0F11; --surface: #17191C; --border: #2A2D31;
    --text: #F2F3F0; --muted: #9A9EA3; --accent: #C6F432;
    --pending-bg: #23272e; --pending-fg: #b9c2cf;
    --happened-bg: #0f2e26; --happened-fg: #6fe0b8;
    --partial-bg: #362a10; --partial-fg: #ebc46e;
    --not-bg: #3a1a17; --not-fg: #f3a197;
  }
  html, body { margin: 0; }
  body {
    width: 2560px; height: 1440px; overflow: hidden; position: relative;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  /* dot grid, fading out towards the centre */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, #2A2D31 2.2px, transparent 2.6px);
    background-size: 48px 48px; background-position: 24px 24px;
    -webkit-mask-image: radial-gradient(ellipse 900px 360px at 50% 50%, transparent 55%, #000 100%);
            mask-image: radial-gradient(ellipse 900px 360px at 50% 50%, transparent 55%, #000 100%);
    opacity: 0.9;
  }
  .glow {
    position: absolute; left: 50%; top: 50%; width: 1500px; height: 560px; transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(198, 244, 50, 0.09), rgba(198, 244, 50, 0) 65%);
  }

  /* centre: logo, name, tagline (inside the safe area) */
  .centre {
    position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  }
  .lockup { display: flex; align-items: center; gap: 44px; }
  .lockup svg { width: 176px; height: 176px; flex: none; margin-top: 10px; }
  .name { font-size: 158px; font-weight: 700; letter-spacing: -3px; line-height: 1; white-space: nowrap; }
  .name .amp { color: var(--accent); font-weight: 600; }
  .tagline { font-size: 50px; font-weight: 500; color: var(--muted); letter-spacing: 0.2px; margin: 0; }
  .tagline b { color: var(--text); font-weight: 600; }
  .tagline i { font-style: normal; color: var(--accent); font-weight: 600; }

  /* side decoration: abstract prediction cards like on the site, no text */
  .card {
    position: absolute; width: 380px; height: 168px; box-sizing: border-box;
    background: var(--surface); border: 2px solid var(--border); border-radius: 22px;
    padding: 26px 28px;
  }
  .card .top { display: flex; align-items: center; justify-content: space-between; }
  .card .who { width: 120px; height: 16px; border-radius: 8px; background: #3a3e44; }
  .card .pill { width: 92px; height: 28px; border-radius: 14px; }
  .card .line { height: 13px; border-radius: 7px; background: #2c3035; margin-top: 18px; }
  .card .line + .line { margin-top: 12px; }
  .card .bar { height: 10px; border-radius: 5px; background: var(--border); margin-top: 22px; overflow: hidden; }
  .card .bar span { display: block; height: 100%; border-radius: 5px; }
  .s-happened .pill { background: var(--happened-bg); box-shadow: inset 0 0 0 2px var(--happened-fg); }
  .s-happened .bar span { background: var(--happened-fg); width: 100%; }
  .s-partial .pill { background: var(--partial-bg); box-shadow: inset 0 0 0 2px var(--partial-fg); }
  .s-partial .bar span { background: var(--partial-fg); width: 100%; }
  .s-not .pill { background: var(--not-bg); box-shadow: inset 0 0 0 2px var(--not-fg); }
  .s-not .bar span { background: var(--not-fg); width: 100%; }
  .s-pending .pill { background: var(--pending-bg); box-shadow: inset 0 0 0 2px var(--pending-fg); }
  .s-pending .bar span { background: var(--accent); width: 38%; }
  .s-pending2 .pill { background: var(--pending-bg); box-shadow: inset 0 0 0 2px var(--pending-fg); }
  .s-pending2 .bar span { background: var(--accent); width: 71%; }
  .faint { opacity: 0.35; }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="glow"></div>

  <!-- left column (x 70-450): two cards in the desktop band, faint ones above and below for TV -->
  <div class="card s-happened faint" style="left:70px; top:300px"><div class="top"><div class="who"></div><div class="pill"></div></div><div class="line" style="width:92%"></div><div class="line" style="width:64%"></div><div class="bar"><span></span></div></div>
  <div class="card s-pending" style="left:70px; top:530px"><div class="top"><div class="who"></div><div class="pill"></div></div><div class="line" style="width:88%"></div><div class="line" style="width:58%"></div><div class="bar"><span></span></div></div>
  <div class="card s-not" style="left:70px; top:730px"><div class="top"><div class="who" style="width:96px"></div><div class="pill"></div></div><div class="line" style="width:95%"></div><div class="line" style="width:70%"></div><div class="bar"><span></span></div></div>
  <div class="card s-pending2 faint" style="left:70px; top:960px"><div class="top"><div class="who"></div><div class="pill"></div></div><div class="line" style="width:80%"></div><div class="line" style="width:52%"></div><div class="bar"><span></span></div></div>

  <!-- right column (x 2110-2490) -->
  <div class="card s-not faint" style="left:2110px; top:300px"><div class="top"><div class="who" style="width:104px"></div><div class="pill"></div></div><div class="line" style="width:86%"></div><div class="line" style="width:60%"></div><div class="bar"><span></span></div></div>
  <div class="card s-partial" style="left:2110px; top:530px"><div class="top"><div class="who" style="width:104px"></div><div class="pill"></div></div><div class="line" style="width:94%"></div><div class="line" style="width:66%"></div><div class="bar"><span></span></div></div>
  <div class="card s-happened" style="left:2110px; top:730px"><div class="top"><div class="who"></div><div class="pill"></div></div><div class="line" style="width:84%"></div><div class="line" style="width:55%"></div><div class="bar"><span></span></div></div>
  <div class="card s-pending faint" style="left:2110px; top:960px"><div class="top"><div class="who" style="width:96px"></div><div class="pill"></div></div><div class="line" style="width:90%"></div><div class="line" style="width:62%"></div><div class="bar"><span></span></div></div>

  <div class="centre">
    <div class="lockup">
      <svg viewBox="0.8 2.8 26.4 23.2" fill="none" aria-hidden="true">
        <path d="M5 4h18a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3h-9l-5.5 4.5V20H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Z" stroke="#C6F432" stroke-width="1.9" stroke-linejoin="round"/>
        <path d="m9 12 3.2 3.2L19 8.5" stroke="#C6F432" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="name">Said <span class="amp">&amp;</span> Done</div>
    </div>
    <p class="tagline"><b>What was said.</b> <i>What happened.</i></p>
  </div>
</body>
</html>
